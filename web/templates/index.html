<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商商品价格对比工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .search-box input {
            width: 70%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            border-color: #667eea;
        }
        .search-box button {
            width: 25%;
            padding: 15px 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .stats-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .stat-item .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .stat-item .value.high { color: #e74c3c; }
        .stat-item .value.low { color: #27ae60; }
        .stat-item .value.avg { color: #3498db; }
        .results-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .product-list {
            display: grid;
            gap: 20px;
        }
        .product-card {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 10px;
            transition: box-shadow 0.3s, transform 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        .product-card.platform-jd { border-left: 4px solid #e74c3c; }
        .product-card.platform-taobao { border-left: 4px solid #ff4400; }
        .product-card.platform-pinduoduo { border-left: 4px solid #ff6b6b; }
        .product-info {
            flex: 1;
        }
        .product-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }
        .product-info .meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .product-price {
            text-align: right;
        }
        .product-price .price {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }
        .product-price .value-score {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 12px;
            background: #27ae60;
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }
        .recommendation-badge {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }
        .platform-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 10px;
        }
        .platform-tag.jd { background: #fdecea; color: #e74c3c; }
        .platform-tag.taobao { background: #fff0eb; color: #ff4400; }
        .platform-tag.pinduoduo { background: #ffeaea; color: #ff6b6b; }
        .btn-demo {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 20px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn-demo:hover {
            background: rgba(255,255,255,0.3);
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .search-box input { width: 100%; margin-bottom: 15px; }
            .search-box button { width: 100%; }
            .product-card { flex-direction: column; text-align: center; }
            .product-price { margin-top: 15px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 电商商品价格对比工具</h1>
            <p>一键对比京东、淘宝、拼多多商品价格，智能推荐高性价比商品</p>
            <a href="#" class="btn-demo" onclick="loadSample()">📊 加载示例数据演示</a>
        </div>

        <div class="search-box">
            <input type="text" id="keyword" placeholder="请输入商品关键词，例如：iPhone 15 Pro" />
            <button id="searchBtn" onclick="search()">开始搜索</button>
        </div>

        <div class="warning">
            ⚠️ 注意：由于电商平台的反爬机制，实际抓取可能会受到限制。本工具仅供学习和研究使用，请遵守各平台的使用规则。
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>点击上方按钮开始搜索，或加载示例数据查看效果</p>
            </div>
        </div>
    </div>

    <script>
        async function search() {
            const keyword = document.getElementById('keyword').value.trim();
            const btn = document.getElementById('searchBtn');
            
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '搜索中...';
            
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在抓取京东、淘宝、拼多多数据...</p>
                    <p style="font-size: 14px; opacity: 0.8;">预计需要30秒左右，请耐心等待</p>
                </div>
            `;
            
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword })
            });
            
            const result = await response.json();
            
            if (result.status === 'started') {
                await checkStatus(keyword);
            } else if (result.status === 'success') {
                displayResults(result.data);
            } else if (result.status === 'running') {
                alert('系统正在处理其他请求，请稍候');
            }
            
            btn.disabled = false;
            btn.textContent = '开始搜索';
        }

        async function checkStatus(keyword) {
            for (let i = 0; i < 60; i++) {
                await sleep(2000);
                
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    displayResults(result.data);
                    return;
                }
            }
            
            alert('请求超时，请重试');
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <p>请求超时，请重试或加载示例数据</p>
                </div>
            `;
        }

        async function loadSample() {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载示例数据...</p>
                </div>
            `;
            
            const response = await fetch('/api/sample');
            const result = await response.json();
            
            if (result.status === 'success') {
                displayResults(result.data);
            }
        }

        function displayResults(data) {
            if (data.error) {
                document.getElementById('content').innerHTML = `
                    <div class="results-section">
                        <p style="color: #e74c3c; text-align: center; padding: 40px;">
                            出错了: ${data.error}
                        </p>
                    </div>
                `;
                return;
            }
            
            const stats = data.stats || {
                total_items: 0,
                avg_price: 0,
                min_price: 0,
                max_price: 0,
                median_price: 0,
                price_range: 0
            };
            const items = data.items || [];
            const recommendations = data.recommendations || [];
            
            if (items.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="results-section">
                        <p style="color: #666; text-align: center; padding: 40px;">
                            未采集到任何数据，请尝试其他关键词或查看示例数据
                        </p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="stats-card">
                    <div class="stat-item">
                        <div class="label">商品总数</div>
                        <div class="value">${stats.total_items}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">平均价格</div>
                        <div class="value avg">¥${stats.avg_price.toFixed(2)}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">最低价格</div>
                        <div class="value low">¥${stats.min_price.toFixed(2)}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">最高价格</div>
                        <div class="value high">¥${stats.max_price.toFixed(2)}</div>
                    </div>
                </div>

                <div class="results-section">
                    <div class="section-title">🏆 高性价比推荐 <span style="font-size: 14px; font-weight: normal; color: #666;">(基于销量、评分、价格综合计算)</span></div>
                    <div class="product-list">
            `;
            
            recommendations.forEach(item => {
                html += `
                    <div class="product-card platform-${getPlatformClass(item.platform)}">
                        <div class="product-info">
                            <h3>
                                <span class="platform-tag ${getPlatformClass(item.platform)}">${item.platform}</span>
                                ${item.name}
                                <span class="recommendation-badge">推荐</span>
                            </h3>
                            <div class="meta">销量: ${item.sales.toLocaleString()} | 店铺评分: ${item.rating}</div>
                            <div class="meta"><a href="${item.url}" target="_blank" style="color: #3498db;">查看详情 →</a></div>
                        </div>
                        <div class="product-price">
                            <div class="price">¥${item.price.toFixed(2)}</div>
                            <div class="value-score">性价比: ${item.value_score.toFixed(1)}</div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            html += `
                <div class="results-section">
                    <div class="section-title">📋 商品列表 <span style="font-size: 14px; font-weight: normal; color: #666;">(按价格从低到高排序，共${data.total_count}件商品，显示前20件)</span></div>
                    <div class="product-list">
            `;
            
            items.forEach(item => {
                html += `
                    <div class="product-card platform-${getPlatformClass(item.platform)}">
                        <div class="product-info">
                            <h3>
                                <span class="platform-tag ${getPlatformClass(item.platform)}">${item.platform}</span>
                                ${item.name}
                            </h3>
                            <div class="meta">销量: ${item.sales.toLocaleString()} | 店铺评分: ${item.rating}</div>
                            <div class="meta"><a href="${item.url}" target="_blank" style="color: #3498db;">查看详情 →</a></div>
                        </div>
                        <div class="product-price">
                            <div class="price">¥${item.price.toFixed(2)}</div>
                            <div class="value-score">性价比: ${item.value_score.toFixed(1)}</div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            
            document.getElementById('content').innerHTML = html;
        }

        function getPlatformClass(platform) {
            if (platform === '京东') return 'jd';
            if (platform === '淘宝') return 'taobao';
            if (platform === '拼多多') return 'pinduoduo';
            return '';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
